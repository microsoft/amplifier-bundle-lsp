bundle:
  name: behavior-lsp-core
  version: 0.2.0

tools:
  - module: tool-lsp
    source: git+https://github.com/microsoft/amplifier-bundle-lsp@main#subdirectory=modules/tool-lsp
    config:
      # Empty! Language bundles fill via deep merge
      languages: {}
      # Optional shared settings
      timeout_seconds: 30
      max_retries: 3

context:
  include: []
  # lsp-general.md moved to context-sink pattern: loads via code-navigator agent
  # delegation only, reducing always-on token cost per foundation BUNDLE_GUIDE.md
  # § "Behavior context.include Policy"

agents:
  include:
    - lsp:code-navigator

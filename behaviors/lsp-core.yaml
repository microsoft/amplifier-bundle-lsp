bundle:
  name: behavior-lsp-core
  version: 0.2.0

tools:
  - module: tool-lsp
    source: git+https://github.com/microsoft/amplifier-bundle-lsp@main#subdirectory=modules/tool-lsp
    config:
      # Empty! Language bundles fill via deep merge
      languages: {}
      # Optional shared settings
      timeout_seconds: 30
      max_retries: 3

agents:
  include:
    - lsp:code-navigator

# lsp-general.md is loaded via the code-navigator agent body (context-sink pattern).
# Delegate to code-navigator for any non-trivial LSP work — it carries the full primer.
